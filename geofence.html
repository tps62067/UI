<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全区域 - 宠物GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 70px;
        }
        .map-container {
            height: calc(100vh - 230px);
            background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .safe-zone {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            border: 2px dashed #10B981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zone-center {
            width: 10px;
            height: 10px;
            background-color: #10B981;
            border-radius: 50%;
        }
        .resize-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: white;
            border: 2px solid #10B981;
            border-radius: 50%;
        }
        .handle-n {
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }
        .handle-e {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
        }
        .handle-s {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }
        .handle-w {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
        }
        .location-marker {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <div class="bg-white px-4 py-4 shadow-sm">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <a href="home.html" class="mr-4">
                    <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
                </a>
                <h1 class="text-lg font-semibold text-gray-800">安全区域</h1>
            </div>
            <button class="text-white bg-blue-500 px-3 py-1 rounded-lg text-sm">
                保存
            </button>
        </div>
    </div>

    <!-- 选择宠物和区域 -->
    <div class="px-4 py-3 bg-white border-b border-gray-200">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full overflow-hidden mr-3">
                    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
                </div>
                <div>
                    <h3 class="font-semibold text-gray-800">奶糖</h3>
                    <p class="text-xs text-gray-500">柯基 • 2岁</p>
                </div>
            </div>
            <div class="flex items-center">
                <select class="bg-gray-100 border-0 text-gray-700 text-sm rounded-lg py-1 px-3 mr-2">
                    <option>家</option>
                    <option>公园</option>
                    <option>宠物店</option>
                    <option>+ 新区域</option>
                </select>
                <button class="text-blue-500 bg-blue-50 p-1 rounded-full">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 地图容器 -->
    <div class="map-container">
        <!-- 安全区域 -->
        <div class="safe-zone">
            <div class="zone-center"></div>
            <!-- 调整手柄 -->
            <div class="resize-handle handle-n"></div>
            <div class="resize-handle handle-e"></div>
            <div class="resize-handle handle-s"></div>
            <div class="resize-handle handle-w"></div>
        </div>
        
        <!-- 宠物位置标记 -->
        <div class="location-marker">
            <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center relative">
                <i class="fas fa-paw text-white"></i>
                <div class="absolute -top-1 -right-1 w-4 h-4 bg-white rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="px-4 pt-4 pb-2 bg-white border-t border-gray-200">
        <div class="flex justify-between items-center mb-4">
            <div class="flex-1">
                <h3 class="font-semibold text-gray-800 mb-1">安全区域半径</h3>
                <p class="text-xs text-gray-500">当宠物离开此区域时将发送通知</p>
            </div>
            <div class="text-right">
                <div class="text-lg font-bold text-blue-500">100 米</div>
            </div>
        </div>
        
        <div class="mb-4">
            <input type="range" min="50" max="500" value="100" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-500">
            <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>50m</span>
                <span>500m</span>
            </div>
        </div>
        
        <div class="flex justify-between items-center mb-4">
            <div>
                <h3 class="font-semibold text-gray-800">区域形状</h3>
            </div>
            <div class="flex items-center gap-2">
                <button class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white">
                    <i class="fas fa-circle"></i>
                </button>
                <button class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600">
                    <i class="fas fa-square"></i>
                </button>
                <button class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600">
                    <i class="fas fa-draw-polygon"></i>
                </button>
            </div>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="flex-1">
                <h3 class="font-semibold text-gray-800">活动报警</h3>
                <p class="text-xs text-gray-500">宠物离开区域时通知我</p>
            </div>
            <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" value="" class="sr-only peer" checked>
                <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
            </label>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2">
        <a href="home.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="map.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-map-marker-alt text-xl"></i>
            <span class="text-xs mt-1">地图</span>
        </a>
        <a href="pets.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-paw text-xl"></i>
            <span class="text-xs mt-1">宠物</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">设置</span>
        </a>
    </div>
</body>
</html>
