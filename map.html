<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图 - 宠物GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 70px;
        }
        .map-container {
            height: calc(100vh - 180px);
            background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .location-marker {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .pet-marker {
            left: 60%;
            top: 45%;
        }
        .user-marker {
            left: 45%;
            top: 55%;
        }
        .distance-line {
            position: absolute;
            left: 45%;
            top: 55%;
            width: 15%;
            height: 10%;
            border-top: 2px dashed #3B82F6;
            transform: rotate(-45deg);
            transform-origin: 0 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <div class="bg-white px-4 py-4 shadow-sm">
        <div class="flex items-center">
            <a href="home.html" class="mr-4">
                <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
            </a>
            <h1 class="text-lg font-semibold text-gray-800">地图</h1>
        </div>
    </div>

    <!-- 宠物选择 -->
    <div class="px-4 py-3 bg-white border-b border-gray-200">
        <div class="flex items-center">
            <div class="w-10 h-10 rounded-full overflow-hidden mr-3">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-gray-800">奶糖</h3>
                    <div class="flex items-center text-sm text-green-600">
                        <i class="fas fa-circle text-xs mr-1"></i>
                        <span>在线</span>
                    </div>
                </div>
                <p class="text-xs text-gray-500">最后更新: 1分钟前</p>
            </div>
            <div class="ml-3">
                <button class="bg-gray-100 p-2 rounded-full">
                    <i class="fas fa-chevron-down text-gray-600"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 地图控制栏 -->
    <div class="px-4 py-2 bg-white border-b border-gray-200 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button class="text-sm text-gray-600 bg-gray-100 py-1 px-3 rounded-full flex items-center">
                <i class="fas fa-layer-group mr-1"></i>
                <span>图层</span>
            </button>
            <button class="text-sm text-gray-600 bg-gray-100 py-1 px-3 rounded-full flex items-center">
                <i class="fas fa-location-arrow mr-1"></i>
                <span>定位</span>
            </button>
        </div>
        <div class="flex space-x-1">
            <button class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-600">
                <i class="fas fa-plus"></i>
            </button>
            <button class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-600">
                <i class="fas fa-minus"></i>
            </button>
        </div>
    </div>

    <!-- 地图容器 -->
    <div class="map-container">
        <!-- 距离线 -->
        <div class="distance-line"></div>
        
        <!-- 用户位置标记 -->
        <div class="location-marker user-marker">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-white"></i>
            </div>
            <div class="mt-1 bg-white px-2 py-1 rounded-lg shadow-sm text-xs text-center">
                您的位置
            </div>
        </div>
        
        <!-- 宠物位置标记 -->
        <div class="location-marker pet-marker">
            <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center relative">
                <i class="fas fa-paw text-white"></i>
                <div class="absolute -top-1 -right-1 w-4 h-4 bg-white rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                </div>
            </div>
            <div class="mt-1 bg-white px-2 py-1 rounded-lg shadow-sm text-xs text-center">
                奶糖 • 100米
            </div>
        </div>
    </div>

    <!-- 地址信息卡 -->
    <div class="absolute bottom-16 left-0 right-0 px-4">
        <div class="bg-white rounded-xl shadow-md p-4">
            <div class="flex justify-between items-start">
                <div class="flex-1">
                    <h3 class="font-semibold text-gray-800 mb-1">北京市朝阳区建国路89号</h3>
                    <p class="text-xs text-gray-500">更新于: 2023年7月20日 15:23</p>
                </div>
                <button class="ml-3 bg-blue-500 text-white py-2 px-4 rounded-lg text-sm">
                    <i class="fas fa-directions mr-1"></i> 导航
                </button>
            </div>
            <div class="mt-3 flex items-center">
                <i class="fas fa-running text-gray-500 mr-2"></i>
                <span class="text-sm text-gray-600">宠物正在移动, 速度: 3 km/h</span>
            </div>
        </div>
    </div>

    <!-- 底部工具栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2">
        <a href="home.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="map.html" class="flex flex-col items-center text-blue-500">
            <i class="fas fa-map-marker-alt text-xl"></i>
            <span class="text-xs mt-1">地图</span>
        </a>
        <a href="pets.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-paw text-xl"></i>
            <span class="text-xs mt-1">宠物</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">设置</span>
        </a>
    </div>

    <!-- 地图模式选择浮动按钮 -->
    <div class="absolute right-4 bottom-20 flex flex-col gap-2">
        <button class="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-gray-600 border border-gray-200">
            <i class="fas fa-satellite"></i>
        </button>
        <button class="w-10 h-10 bg-blue-500 rounded-full shadow-md flex items-center justify-center text-white">
            <i class="fas fa-map"></i>
        </button>
        <button class="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-gray-600 border border-gray-200">
            <i class="fas fa-road"></i>
        </button>
    </div>
</body>
</html>
