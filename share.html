<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置分享 - 宠物GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 70px;
        }
        .map-preview {
            height: 220px;
            background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .location-marker {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <div class="bg-white px-4 py-4 shadow-sm">
        <div class="flex items-center">
            <a href="home.html" class="mr-4">
                <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
            </a>
            <h1 class="text-lg font-semibold text-gray-800">位置分享</h1>
        </div>
    </div>

    <!-- 选择宠物 -->
    <div class="px-4 py-3 bg-white border-b border-gray-200">
        <div class="flex items-center">
            <div class="w-10 h-10 rounded-full overflow-hidden mr-3">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-gray-800">奶糖</h3>
                    <div class="flex items-center text-sm text-green-600">
                        <i class="fas fa-circle text-xs mr-1"></i>
                        <span>在线</span>
                    </div>
                </div>
                <p class="text-xs text-gray-500">北京市朝阳区建国路89号</p>
            </div>
            <div class="ml-3">
                <button class="bg-gray-100 p-2 rounded-full">
                    <i class="fas fa-chevron-down text-gray-600"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 地图预览 -->
    <div class="map-preview relative mb-4">
        <!-- 宠物位置标记 -->
        <div class="location-marker">
            <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center relative">
                <i class="fas fa-paw text-white"></i>
                <div class="absolute -top-1 -right-1 w-4 h-4 bg-white rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                </div>
            </div>
        </div>
        
        <!-- 分享按钮 -->
        <div class="absolute left-0 right-0 bottom-0 p-3 bg-gradient-to-t from-black/50 to-transparent flex justify-end">
            <button class="bg-white text-gray-800 px-3 py-1 rounded-lg text-sm flex items-center">
                <i class="fas fa-expand-alt mr-1 text-xs"></i>
                <span>查看详情</span>
            </button>
        </div>
    </div>

    <!-- 分享选项 -->
    <div class="px-4 mb-6">
        <h2 class="text-md font-semibold text-gray-700 mb-3">分享设置</h2>
        
        <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex-1">
                    <h3 class="font-semibold text-gray-800 mb-1">分享模式</h3>
                    <p class="text-xs text-gray-500">选择一个分享的有效期</p>
                </div>
                <div>
                    <select class="bg-gray-100 border-0 text-gray-700 text-sm rounded-lg py-1 px-3">
                        <option>1小时</option>
                        <option>4小时</option>
                        <option>24小时</option>
                        <option>永久</option>
                    </select>
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex-1">
                    <h3 class="font-semibold text-gray-800">实时更新</h3>
                    <p class="text-xs text-gray-500">被分享人可以看到宠物实时位置更新</p>
                </div>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" value="" class="sr-only peer" checked>
                    <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                </label>
            </div>
            
            <div class="flex justify-between items-center">
                <div class="flex-1">
                    <h3 class="font-semibold text-gray-800">历史轨迹</h3>
                    <p class="text-xs text-gray-500">被分享人可以查看历史活动轨迹</p>
                </div>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" value="" class="sr-only peer">
                    <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                </label>
            </div>
        </div>
        
        <!-- 分享方式 -->
        <h2 class="text-md font-semibold text-gray-700 mb-3">分享方式</h2>
        
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mb-1">
                    <i class="fab fa-weixin text-green-600 text-xl"></i>
                </div>
                <span class="text-xs text-gray-700">微信</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center mb-1">
                    <i class="fas fa-comment-dots text-blue-500 text-xl"></i>
                </div>
                <span class="text-xs text-gray-700">短信</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 rounded-full bg-purple-100 flex items-center justify-center mb-1">
                    <i class="fas fa-envelope text-purple-500 text-xl"></i>
                </div>
                <span class="text-xs text-gray-700">邮件</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center mb-1">
                    <i class="fas fa-ellipsis-h text-gray-500 text-xl"></i>
                </div>
                <span class="text-xs text-gray-700">更多</span>
            </div>
        </div>
        
        <!-- 分享链接 -->
        <div class="mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3">分享链接</h2>
            
            <div class="bg-white rounded-xl shadow-sm p-4">
                <div class="flex justify-between items-center mb-4">
                    <p class="text-xs text-gray-500">生成一个分享链接，可通过多种渠道发送</p>
                    <button class="bg-blue-500 text-white py-1 px-3 rounded-lg text-sm">
                        生成链接
                    </button>
                </div>
                
                <div class="bg-gray-50 rounded-lg p-3 flex items-center">
                    <div class="flex-1 truncate text-sm text-gray-600">
                        https://pet-tracker.com/share/8f72a3b9
                    </div>
                    <button class="ml-2 text-blue-500">
                        <i class="far fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 已共享记录 -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-semibold text-gray-700">已共享</h2>
                <span class="text-xs text-gray-500">2人</span>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden divide-y divide-gray-100">
                <div class="p-4 flex items-center">
                    <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center mr-3 flex-shrink-0">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h3 class="font-medium text-gray-800">张小明</h3>
                            <span class="text-xs text-gray-500">1小时前</span>
                        </div>
                        <p class="text-xs text-gray-500">有效期至: 今天 23:59</p>
                    </div>
                    <button class="text-red-500 text-sm ml-2">
                        取消
                    </button>
                </div>
                
                <div class="p-4 flex items-center">
                    <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center mr-3 flex-shrink-0">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h3 class="font-medium text-gray-800">李华</h3>
                            <span class="text-xs text-gray-500">昨天</span>
                        </div>
                        <p class="text-xs text-gray-500">永久有效</p>
                    </div>
                    <button class="text-red-500 text-sm ml-2">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2">
        <a href="home.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="map.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-map-marker-alt text-xl"></i>
            <span class="text-xs mt-1">地图</span>
        </a>
        <a href="pets.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-paw text-xl"></i>
            <span class="text-xs mt-1">宠物</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">设置</span>
        </a>
    </div>
</body>
</html>
