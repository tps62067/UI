<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 宠物GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 70px;
        }
        .status-online {
            background-color: #10B981;
        }
        .status-offline {
            background-color: #9CA3AF;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部状态栏 -->
    <div class="bg-white px-4 py-6 shadow-sm">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">宠物追踪</h1>
                <p class="text-sm text-gray-500">欢迎回来，铲屎官</p>
            </div>
            <div class="flex items-center space-x-3">
                <button class="text-gray-600 bg-gray-100 p-2 rounded-full">
                    <i class="fas fa-bell text-lg"></i>
                </button>
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="px-4 py-4">
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">我的宠物</h2>
            
            <!-- 宠物卡片 - 在线 -->
            <div class="bg-white rounded-xl shadow-sm p-4 mb-3 relative">
                <div class="status-online w-3 h-3 rounded-full absolute right-4 top-4"></div>
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full overflow-hidden mr-4">
                        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800">奶糖</h3>
                        <p class="text-sm text-gray-500">柯基 • 2岁</p>
                        <div class="flex items-center text-sm text-green-600 mt-1">
                            <i class="fas fa-signal mr-1"></i>
                            <span>信号良好</span>
                        </div>
                    </div>
                </div>
                <div class="mt-3 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-500">当前位置</p>
                        <p class="text-sm font-medium text-gray-700">北京市朝阳区建国路89号</p>
                    </div>
                    <button class="bg-blue-500 text-white py-2 px-4 rounded-lg text-sm">
                        <i class="fas fa-map-marker-alt mr-1"></i> 查看
                    </button>
                </div>
            </div>
            
            <!-- 宠物卡片 - 离线 -->
            <div class="bg-white rounded-xl shadow-sm p-4 relative">
                <div class="status-offline w-3 h-3 rounded-full absolute right-4 top-4"></div>
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full overflow-hidden mr-4">
                        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800">咪咪</h3>
                        <p class="text-sm text-gray-500">橘猫 • 3岁</p>
                        <div class="flex items-center text-sm text-gray-500 mt-1">
                            <i class="fas fa-power-off mr-1"></i>
                            <span>离线 (2小时前)</span>
                        </div>
                    </div>
                </div>
                <div class="mt-3 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-500">最后位置</p>
                        <p class="text-sm font-medium text-gray-700">北京市朝阳区建国路89号</p>
                    </div>
                    <button class="bg-gray-200 text-gray-600 py-2 px-4 rounded-lg text-sm">
                        <i class="fas fa-map-marker-alt mr-1"></i> 查看
                    </button>
                </div>
            </div>
        </div>

        <!-- 快捷操作 -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">快捷操作</h2>
            <div class="grid grid-cols-4 gap-4">
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center mb-1">
                        <i class="fas fa-map-marker-alt text-blue-500 text-xl"></i>
                    </div>
                    <span class="text-xs text-gray-700">实时位置</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-purple-100 flex items-center justify-center mb-1">
                        <i class="fas fa-route text-purple-500 text-xl"></i>
                    </div>
                    <span class="text-xs text-gray-700">历史轨迹</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mb-1">
                        <i class="fas fa-draw-polygon text-green-500 text-xl"></i>
                    </div>
                    <span class="text-xs text-gray-700">安全区域</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-amber-100 flex items-center justify-center mb-1">
                        <i class="fas fa-share-alt text-amber-500 text-xl"></i>
                    </div>
                    <span class="text-xs text-gray-700">位置分享</span>
                </div>
            </div>
        </div>

        <!-- 状态信息 -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">设备状态</h2>
            <div class="bg-white rounded-xl shadow-sm p-4">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                            <i class="fas fa-microchip text-blue-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">奶糖的追踪器</h3>
                            <p class="text-xs text-gray-500">最后更新: 刚刚</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="flex items-center text-sm text-green-600">
                            <i class="fas fa-circle text-xs mr-1"></i>
                            <span>活跃</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between mb-2">
                    <div class="text-center flex-1">
                        <p class="text-xs text-gray-500 mb-1">电池</p>
                        <div class="flex items-center justify-center">
                            <i class="fas fa-battery-three-quarters text-green-500 mr-1"></i>
                            <span class="font-medium">78%</span>
                        </div>
                    </div>
                    <div class="text-center flex-1">
                        <p class="text-xs text-gray-500 mb-1">信号</p>
                        <div class="flex items-center justify-center">
                            <i class="fas fa-signal text-green-500 mr-1"></i>
                            <span class="font-medium">优</span>
                        </div>
                    </div>
                    <div class="text-center flex-1">
                        <p class="text-xs text-gray-500 mb-1">温度</p>
                        <div class="flex items-center justify-center">
                            <i class="fas fa-temperature-low text-blue-500 mr-1"></i>
                            <span class="font-medium">26°C</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2">
        <a href="home.html" class="flex flex-col items-center text-blue-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="map.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-map-marker-alt text-xl"></i>
            <span class="text-xs mt-1">地图</span>
        </a>
        <a href="pets.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-paw text-xl"></i>
            <span class="text-xs mt-1">宠物</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">设置</span>
        </a>
    </div>
</body>
</html>
