<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物管理 - 宠物GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 70px;
        }
        .status-online {
            background-color: #10B981;
        }
        .status-offline {
            background-color: #9CA3AF;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <div class="bg-white px-4 py-4 shadow-sm">
        <div class="flex justify-between items-center">
            <h1 class="text-lg font-semibold text-gray-800">宠物管理</h1>
            <button class="bg-blue-500 text-white py-1 px-3 rounded-lg text-sm flex items-center">
                <i class="fas fa-plus mr-1"></i>
                <span>添加宠物</span>
            </button>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="p-4">
        <!-- 宠物列表 -->
        <div class="mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3">我的宠物</h2>
            
            <!-- 宠物卡片 1 -->
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4 relative overflow-hidden">
                <div class="status-online w-3 h-3 rounded-full absolute right-4 top-4"></div>
                
                <div class="flex">
                    <div class="w-20 h-20 rounded-xl overflow-hidden mr-4 flex-shrink-0">
                        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
                    </div>
                    
                    <div class="flex-1">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-gray-800 text-lg">奶糖</h3>
                            <button class="text-gray-400 p-1">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-y-1 mb-3">
                            <div class="flex items-center text-sm">
                                <i class="fas fa-paw text-gray-400 mr-2"></i>
                                <span class="text-gray-600">柯基犬</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <i class="fas fa-birthday-cake text-gray-400 mr-2"></i>
                                <span class="text-gray-600">2岁</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <i class="fas fa-venus-mars text-gray-400 mr-2"></i>
                                <span class="text-gray-600">公</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <i class="fas fa-weight text-gray-400 mr-2"></i>
                                <span class="text-gray-600">12.5 kg</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center text-sm text-green-600">
                            <i class="fas fa-signal mr-1"></i>
                            <span>设备已连接</span>
                        </div>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="flex justify-between mt-4 border-t border-gray-100 pt-3">
                    <button class="flex items-center justify-center text-gray-600 flex-1">
                        <i class="fas fa-edit mr-1"></i>
                        <span>编辑</span>
                    </button>
                    <div class="w-px h-6 bg-gray-200"></div>
                    <button class="flex items-center justify-center text-gray-600 flex-1">
                        <i class="fas fa-microchip mr-1"></i>
                        <span>设备</span>
                    </button>
                    <div class="w-px h-6 bg-gray-200"></div>
                    <button class="flex items-center justify-center text-blue-500 flex-1">
                        <i class="fas fa-map-marker-alt mr-1"></i>
                        <span>定位</span>
                    </button>
                </div>
            </div>
            
            <!-- 宠物卡片 2 -->
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4 relative overflow-hidden">
                <div class="status-offline w-3 h-3 rounded-full absolute right-4 top-4"></div>
                
                <div class="flex">
                    <div class="w-20 h-20 rounded-xl overflow-hidden mr-4 flex-shrink-0">
                        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
                    </div>
                    
                    <div class="flex-1">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-gray-800 text-lg">咪咪</h3>
                            <button class="text-gray-400 p-1">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-y-1 mb-3">
                            <div class="flex items-center text-sm">
                                <i class="fas fa-paw text-gray-400 mr-2"></i>
                                <span class="text-gray-600">橘猫</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <i class="fas fa-birthday-cake text-gray-400 mr-2"></i>
                                <span class="text-gray-600">3岁</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <i class="fas fa-venus-mars text-gray-400 mr-2"></i>
                                <span class="text-gray-600">母</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <i class="fas fa-weight text-gray-400 mr-2"></i>
                                <span class="text-gray-600">4.2 kg</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center text-sm text-gray-500">
                            <i class="fas fa-power-off mr-1"></i>
                            <span>设备离线 (2小时前)</span>
                        </div>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="flex justify-between mt-4 border-t border-gray-100 pt-3">
                    <button class="flex items-center justify-center text-gray-600 flex-1">
                        <i class="fas fa-edit mr-1"></i>
                        <span>编辑</span>
                    </button>
                    <div class="w-px h-6 bg-gray-200"></div>
                    <button class="flex items-center justify-center text-gray-600 flex-1">
                        <i class="fas fa-microchip mr-1"></i>
                        <span>设备</span>
                    </button>
                    <div class="w-px h-6 bg-gray-200"></div>
                    <button class="flex items-center justify-center text-gray-400 flex-1">
                        <i class="fas fa-map-marker-alt mr-1"></i>
                        <span>定位</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 提示卡片 -->
        <div class="bg-blue-50 rounded-xl p-4 mb-6">
            <div class="flex">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3 flex-shrink-0">
                    <i class="fas fa-info text-blue-500"></i>
                </div>
                <div>
                    <h3 class="font-medium text-gray-800 mb-1">设备绑定</h3>
                    <p class="text-sm text-gray-600 mb-2">您可以为每个宠物绑定一个GPS设备，实时追踪它们的位置。</p>
                    <button class="text-blue-500 text-sm font-medium flex items-center">
                        <span>查看设备</span>
                        <i class="fas fa-chevron-right ml-1 text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 健康数据 -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-semibold text-gray-700">健康数据</h2>
                <button class="text-sm text-blue-500">查看全部</button>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm p-4">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full overflow-hidden mr-3">
                        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=300&q=80" alt="宠物照片" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">奶糖</h3>
                        <p class="text-xs text-gray-500">最后更新: 今天 10:30</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-orange-50 rounded-lg p-3">
                        <p class="text-xs text-gray-500 mb-1">活动量</p>
                        <div class="flex items-center">
                            <i class="fas fa-running text-orange-500 mr-2"></i>
                            <span class="text-lg font-semibold text-gray-800">75分钟</span>
                        </div>
                    </div>
                    
                    <div class="bg-green-50 rounded-lg p-3">
                        <p class="text-xs text-gray-500 mb-1">行走距离</p>
                        <div class="flex items-center">
                            <i class="fas fa-shoe-prints text-green-500 mr-2"></i>
                            <span class="text-lg font-semibold text-gray-800">1.8公里</span>
                        </div>
                    </div>
                    
                    <div class="bg-purple-50 rounded-lg p-3">
                        <p class="text-xs text-gray-500 mb-1">卡路里</p>
                        <div class="flex items-center">
                            <i class="fas fa-fire-alt text-purple-500 mr-2"></i>
                            <span class="text-lg font-semibold text-gray-800">320千卡</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2">
        <a href="home.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="map.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-map-marker-alt text-xl"></i>
            <span class="text-xs mt-1">地图</span>
        </a>
        <a href="pets.html" class="flex flex-col items-center text-blue-500">
            <i class="fas fa-paw text-xl"></i>
            <span class="text-xs mt-1">宠物</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">设置</span>
        </a>
    </div>
</body>
</html>
