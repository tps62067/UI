<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 宠物GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 70px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <div class="bg-white px-4 py-4 shadow-sm">
        <h1 class="text-lg font-semibold text-gray-800">设置</h1>
    </div>

    <!-- 主体内容 -->
    <div class="p-4">
        <!-- 用户信息 -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
            <div class="flex items-center">
                <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center text-white mr-4">
                    <i class="fas fa-user text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h2 class="font-semibold text-gray-800 text-lg">用户名</h2>
                    <p class="text-sm text-gray-500">example@email.com</p>
                </div>
                <button class="text-blue-500">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
        </div>
        
        <!-- 通用设置 -->
        <div class="mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3 px-1">通用</h2>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden divide-y divide-gray-100">
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                            <i class="fas fa-bell text-blue-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">通知</h3>
                            <p class="text-xs text-gray-500">管理推送提醒设置</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center mr-3">
                            <i class="fas fa-language text-indigo-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">语言</h3>
                            <p class="text-xs text-gray-500">简体中文</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center mr-3">
                            <i class="fas fa-map text-purple-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">地图设置</h3>
                            <p class="text-xs text-gray-500">选择地图提供商和样式</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center mr-3">
                            <i class="fas fa-cloud text-green-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">数据存储</h3>
                            <p class="text-xs text-gray-500">管理本地和云端数据</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
            </div>
        </div>
        
        <!-- 隐私与安全 -->
        <div class="mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3 px-1">隐私与安全</h2>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden divide-y divide-gray-100">
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center mr-3">
                            <i class="fas fa-lock text-amber-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">隐私设置</h3>
                            <p class="text-xs text-gray-500">管理数据共享权限</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-3">
                            <i class="fas fa-shield-alt text-red-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">账户安全</h3>
                            <p class="text-xs text-gray-500">修改密码和安全设置</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-teal-100 flex items-center justify-center mr-3">
                            <i class="fas fa-fingerprint text-teal-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">生物识别</h3>
                            <p class="text-xs text-gray-500">使用指纹或面容解锁</p>
                        </div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="" class="sr-only peer" checked>
                        <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- 设备追踪设置 -->
        <div class="mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3 px-1">追踪设置</h2>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden divide-y divide-gray-100">
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-cyan-100 flex items-center justify-center mr-3">
                            <i class="fas fa-clock text-cyan-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">位置更新频率</h3>
                            <p class="text-xs text-gray-500">1分钟</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center mr-3">
                            <i class="fas fa-history text-pink-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">历史轨迹保存</h3>
                            <p class="text-xs text-gray-500">30天</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center mr-3">
                            <i class="fas fa-battery-half text-orange-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">低电量模式</h3>
                            <p class="text-xs text-gray-500">当设备电量低时降低更新频率</p>
                        </div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="" class="sr-only peer" checked>
                        <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- 其他 -->
        <div class="mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3 px-1">其他</h2>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden divide-y divide-gray-100">
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mr-3">
                            <i class="fas fa-info-circle text-gray-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">关于</h3>
                            <p class="text-xs text-gray-500">版本 1.0.0</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mr-3">
                            <i class="fas fa-question-circle text-gray-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">帮助与支持</h3>
                            <p class="text-xs text-gray-500">常见问题与联系方式</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mr-3">
                            <i class="fas fa-file-alt text-gray-500"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-800">隐私政策</h3>
                            <p class="text-xs text-gray-500">查看我们的隐私条款</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
            </div>
        </div>
        
        <!-- 退出登录 -->
        <div class="mt-8 mb-4">
            <button class="w-full py-3 text-red-500 font-medium bg-white rounded-xl shadow-sm">
                退出登录
            </button>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 px-2">
        <a href="home.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="map.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-map-marker-alt text-xl"></i>
            <span class="text-xs mt-1">地图</span>
        </a>
        <a href="pets.html" class="flex flex-col items-center text-gray-500">
            <i class="fas fa-paw text-xl"></i>
            <span class="text-xs mt-1">宠物</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-blue-500">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs mt-1">设置</span>
        </a>
    </div>
</body>
</html>
